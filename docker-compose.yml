services:
  generator:
    image: python:3.11-slim
    working_dir: /app
    command: ["python", "generate_demo_data.py"]
    volumes:
      - ./generate_demo_data.py:/app/generate_demo_data.py:ro
      - replay_inbox:/app/data
    network_mode: none

  detector:
    image: python:3.11-slim
    working_dir: /app
    command: >-
      sh -c "pip install --no-cache-dir scikit-learn numpy
      && python server_stdlib.py"
    ports:
      - "8787:8787"
    volumes:
      - ./server_stdlib.py:/app/server_stdlib.py:ro
      - ./index.html:/app/index.html:ro
      - replay_inbox:/app/data
    environment:
      UNIGUARD_READ_ONLY: "true"
      PORT: "8787"
    # The detector exposes only the read-only dashboard/API port. It has no
    # route to a monitored network in this demo compose topology.
    networks:
      - analyst_only

volumes:
  replay_inbox:

networks:
  analyst_only:
    internal: true
